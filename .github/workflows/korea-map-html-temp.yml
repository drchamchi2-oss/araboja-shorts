name: Temporary Korea map capture
on:
  push:
    branches:
      - automation/korea-map-html-20260927
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system font
        run: sudo apt-get update && sudo apt-get install -y fonts-nanum
      - name: Install Python dependencies
        run: python -m pip install -r automation/korea_map_html/requirements.txt
      - name: Capture historical and modern maps
        continue-on-error: true
        run: python automation/korea_map_html/capture.py
      - name: Upload capture output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: korea-map-capture
          path: automation/korea_map_html/output/
          if-no-files-found: warn
          retention-days: 1
